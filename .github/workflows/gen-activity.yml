name: Gen activity heatmap

on:
  schedule:
    - cron: "0 * * * *"        # هر ساعت
  workflow_dispatch:           # اجرای دستی (Run workflow)

permissions:
  contents: write

concurrency:
  group: profile-gen          # اجرای هم‌زمان چند generator رو سریال می‌کنه
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify API token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # rate_limit with a valid token shows core limit 5000 (unauthenticated = 60)
          curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/rate_limit \
            | grep -o '"limit": *[0-9]*' | head -1 | sed 's/^/auth check: /'


      - name: Generate gitskins/activity.svg
        run: python3 scripts/gen_profile.py activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitskins/activity.svg
          if git diff --cached --quiet; then
            echo "No changes — already up to date."
          else
            git commit -m "Auto-update gitskins/activity.svg (Gitskins kit)"
            git push
            echo "Pushed."
          fi
