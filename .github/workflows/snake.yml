name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # روزانه ساعت 00:00 UTC
  workflow_dispatch:      # اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: xvviix
          outputs: |
            dist/snake.svg?github_user_name=xvviix&color_snake=#7c3aed&color_dots=#0f172a,#1d4ed8,#0891b2,#10b981,#f59e0b

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
