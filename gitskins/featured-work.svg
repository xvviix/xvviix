    <text x="62" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing="1.6" fill="#f5d061" opacity="0.85">SCREEN 01 — PORTFOLIO</text>
    <text x="62" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing="1.6" fill="#d4af37" opacity="0.9">WEBGL · REAL-TIME 3D · 16,000 PARTICLES</text>

