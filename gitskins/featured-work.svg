          <path d="M 199 213 L 232 232 L 265 213"/>
        </g>
        <g stroke="#f5d061" stroke-width="1.5" fill="none" stroke-linejoin="round">
          <path d="M 232 150 L 265 169 L 232 188 L 199 169 Z"/>
          <path d="M 265 169 L 265 213 M 232 188 L 232 232 M 199 169 L 199 213"/>
          <path d="M 199 213 L 232 232 L 265 213"/>
        </g>
        <circle cx="232" cy="150" r="2.4" fill="#fff3c4"/>
        <circle cx="265" cy="169" r="2.4" fill="#fff3c4"/>
        <circle cx="199" cy="169" r="2.4" fill="#fff3c4"/>
        <circle cx="232" cy="232" r="2.4" fill="#fff3c4"/>
      </g>
