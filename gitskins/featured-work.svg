    <text x="446" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#ccfbf1" opacity="0.75">custom gold shaders, 16,000-particle transitions, fully</text>
    <text x="446" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#ccfbf1" opacity="0.75">bilingual (EN / فارسی). Built from scratch, no templates.</text>

