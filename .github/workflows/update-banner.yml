name: Update banner numbers

on:
  schedule:
    - cron: "0 */2 * * *"      # هر ۲ ساعت (۱۲ بار در روز)
  workflow_dispatch:           # اجرای دستی (دکمه Run workflow)
  push:
    branches: [ main ]
    paths: [ light.svg ]       # وقتی پوستر عوض شد هم آپدیت کن

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live numbers from GitHub API
        id: numbers
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          def gh(path):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "User-Agent": "banner-updater",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  }
              )
              return json.load(urllib.request.urlopen(req, timeout=30))

          user = gh("/users/xvviix")
          repos = gh("/users/xvviix/repos?per_page=100")

          total    = len(repos)                                     # همه ریپوها
          live     = sum(1 for r in repos if r.get("has_pages"))   # سایت‌های GitHub Pages
          stars    = sum(r.get("stargazers_count") or 0 for r in repos)  # مجموع ستاره‌ها
          followers = user.get("followers") or 0                    # فالوورها

          # خروجی برای استپ بعد
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"total={total}\n")
              f.write(f"live={live}\n")
              f.write(f"stars={stars}\n")
              f.write(f"followers={followers}\n")

          # فایل stats.json برای badge های داینامیک README
          stats = {
              "repos": total,
              "live": live,
              "stars": stars,
              "followers": followers,
          }
          with open("stats.json", "w") as f:
              json.dump(stats, f)

          print(f"total={total} live={live} stars={stars} followers={followers}")
          EOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update light.svg with current numbers
        run: |
          python3 - <<'EOF'
          import os, re
          path = "light.svg"
          src = open(path, encoding="utf-8").read()
          total, live, stars, followers = (
              os.environ["TOTAL"], os.environ["LIVE"],
              os.environ["STARS"], os.environ["FOLLOWERS"],
          )
          # placeholders (first run) and baked numbers (later runs) both work
          src = src.replace("__PROJECTS__", total).replace("__LIVE_SITES__", live)
          src = src.replace("__STARS__", stars).replace("__FOLLOWERS__", followers)
          src = re.sub(r"\d+\+ PROJECTS",   total + "+ PROJECTS",   src)
          src = re.sub(r"\d+ LIVE",         live + " LIVE",         src)
          src = re.sub(r"★ \d+ STARS",      "★ " + stars + " STARS", src)
          src = re.sub(r"\d+ FOLLOWERS",    followers + " FOLLOWERS", src)
          open(path, "w", encoding="utf-8").write(src)
          print("Updated light.svg")
          EOF
        env:
          TOTAL: ${{ steps.numbers.outputs.total }}
          LIVE: ${{ steps.numbers.outputs.live }}
          STARS: ${{ steps.numbers.outputs.stars }}
          FOLLOWERS: ${{ steps.numbers.outputs.followers }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add light.svg stats.json
          if git diff --cached --quiet; then
            echo "No changes — numbers are already up to date."
          else
            git commit -m "Auto-update banner + stats (repos: ${{ steps.numbers.outputs.total }}, live: ${{ steps.numbers.outputs.live }}, stars: ${{ steps.numbers.outputs.stars }}, followers: ${{ steps.numbers.outputs.followers }})"
            git push
            echo "Pushed updated banner."
          fi
