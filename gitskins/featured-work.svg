  <style>
    #gs-fw-aurora-dark .fw-orb-a { animation: gs-fw-float-a 9s ease-in-out infinite; }
    #gs-fw-aurora-dark .fw-orb-b { animation: gs-fw-float-b 11s ease-in-out infinite 1.1s; }
    #gs-fw-aurora-dark .fw-orb-c { animation: gs-fw-float-c 13s ease-in-out infinite 0.6s; }
    #gs-fw-aurora-dark .fw-cube { animation: gs-fw-float-cube 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    #gs-fw-aurora-dark .fw-p1 { animation: gs-fw-pfloat 7s ease-in-out infinite; }
    #gs-fw-aurora-dark .fw-p2 { animation: gs-fw-pfloat 9s ease-in-out infinite 1.4s; }
    #gs-fw-aurora-dark .fw-p3 { animation: gs-fw-pfloat 11s ease-in-out infinite 2.2s; }
    #gs-fw-aurora-dark .fw-chip { animation: gs-fw-chip 650ms ease-out both; }
    @keyframes gs-fw-float-a { 0%,100% { transform: translate(0,0); opacity: .5; } 50% { transform: translate(26px,-18px); opacity: .8; } }
    @keyframes gs-fw-float-b { 0%,100% { transform: translate(0,0); opacity: .4; } 50% { transform: translate(-22px,16px); opacity: .7; } }
    @keyframes gs-fw-float-c { 0%,100% { transform: translate(0,0) scale(1); opacity: .32; } 50% { transform: translate(16px,-12px) scale(1.15); opacity: .58; } }
    @keyframes gs-fw-float-cube { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes gs-fw-pfloat { 0%,100% { transform: translateY(0); opacity: .35; } 50% { transform: translateY(-14px); opacity: .9; } }
    @keyframes gs-fw-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
