name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # روزانه ساعت 00:00 UTC
  workflow_dispatch:      # اجرای دستی

permissions:
  contents: write

concurrency:
  group: gen-snake
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify API token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/rate_limit \
            | grep -o '"limit": *[0-9]*' | head -1 | sed 's/^/auth check: /'

      - name: Generate gitskins/snake.svg
        run: python3 scripts/gen_snake.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitskins/snake.svg
          if git diff --cached --quiet; then
            echo "No changes — snake is already up to date."
          else
            git commit -m "Auto-update gitskins/snake.svg (Gitskins kit)"
            for i in 1 2 3; do
            if git push; then echo "Pushed."; exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase origin main || exit 1
          done
          exit 1
          fi
