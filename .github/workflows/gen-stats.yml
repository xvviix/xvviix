name: Gen stats (Gitskins kit)

on:
  schedule:
    - cron: "0  * * * *"        # هر ساعت (gen-stats)        # هر ساعت
  workflow_dispatch:           # اجرای دستی (Run workflow)

permissions:
  contents: write

concurrency:
  group: gen-stats          # اجرای هم‌زمان چند generator رو سریال می‌کنه
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify API token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # rate_limit with a valid token shows core limit 5000 (unauthenticated = 60)
          curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/rate_limit \
            | grep -o '"limit": *[0-9]*' | head -1 | sed 's/^/auth check: /'


      - name: Generate gitskins/stats.svg
        run: python3 scripts/gen_profile.py stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitskins/stats.svg
          if git diff --cached --quiet; then
            echo "No changes — already up to date."
          else
            git commit -m "Auto-update gitskins/stats.svg (Gitskins kit)"
            for i in 1 2 3; do
            if git push; then echo "Pushed."; exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase origin main || exit 1
          done
          exit 1
          fi
